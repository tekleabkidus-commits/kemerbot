name: PHP syntax verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint all PHP application files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Validate PHP syntax
        run: find app tests database/migrations -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/dev/null
